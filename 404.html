<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません — FXトレードログ</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/fx-trade-journal/lp-assets/favicon-32.png">
<style>
  :root{
    --ink:#EDF1FA; --ink-dim:#9099B4; --bg:#05070C; --surface:#0E1420;
    --line:rgba(237,241,250,0.12); --accent:#4F7EF7;
    --font-display:-apple-system,"SF Pro Display","Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    --font-body:-apple-system,"SF Pro Text","Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --ink:#12141C; --ink-dim:#565F78; --bg:#F3F5FA; --surface:#FFFFFF; --line:rgba(18,20,28,0.1); --accent:#3358DB; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:var(--font-body); text-align:center; padding:2rem;
  }
  .card{max-width:420px;}
  h1{font-family:var(--font-display); font-weight:800; font-size:2.4rem; margin:0 0 .5rem; letter-spacing:-0.02em;}
  p{color:var(--ink-dim); font-size:1rem; line-height:1.7; margin:0 0 1.6rem;}
  a{
    display:inline-flex; align-items:center; gap:.5em; color:#fff; background:var(--accent);
    text-decoration:none; font-family:var(--font-display); font-weight:700; padding:.9em 1.6em; border-radius:999px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>お探しのページは見つかりませんでした。URLをご確認いただくか、トップページからやり直してください。</p>
    <a href="/fx-trade-journal/">トップページへ戻る</a>
  </div>
</body>
</html>
