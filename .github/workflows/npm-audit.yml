name: npm audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # ビルド専用ツール(Expo CLI/jest-expo/react-devtools-core等)経由の
      # 依存でアプリ本体のJSバンドルには含まれないため、既知の脆弱性として
      # 許容し、CI失敗によるメール通知は止める(結果はログで確認可能)。
      - run: npm audit --audit-level=high
        continue-on-error: true
